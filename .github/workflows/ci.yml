name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create stub .env.local for doctor
        run: |
          # Structurally valid test fixtures; never use real credentials in CI.
          printf 'NEXT_PUBLIC_AGORA_APP_ID=00000000000000000000000000000000\nNEXT_AGORA_APP_CERTIFICATE=11111111111111111111111111111111\n' > .env.local

      - name: Verify (lint + typecheck + api-contracts + build)
        run: pnpm run verify
